<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bodyTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>

    <linearGradient id="cassetteBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#32323f"/>
      <stop offset="100%" stop-color="#1c1c24"/>
    </linearGradient>

    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f5f4"/>
    </linearGradient>

    <linearGradient id="tapeSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="50%" stop-color="#3d3846"/>
      <stop offset="100%" stop-color="#1e1e24"/>
    </linearGradient>

    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3584e4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g>
    <rect x="8" y="16" width="112" height="102" rx="20" fill="#15539e"/>

    <rect x="8" y="12" width="112" height="102" rx="20" fill="url(#bodyTopGrad)"/>

    <rect x="9" y="13" width="110" height="100" rx="19" fill="none" stroke="#62a0ea" stroke-width="1.5" stroke-opacity="0.6"/>

    <rect x="16" y="22" width="96" height="82" rx="10" fill="url(#cassetteBody)" filter="url(#elementShadow)"/>
    <rect x="16" y="22" width="96" height="82" rx="10" fill="none" stroke="#484857" stroke-width="1"/>

    <circle cx="21" cy="27" r="1.5" fill="#121218"/>
    <circle cx="107" cy="27" r="1.5" fill="#121218"/>
    <circle cx="21" cy="99" r="1.5" fill="#121218"/>
    <circle cx="107" cy="99" r="1.5" fill="#121218"/>

    <rect x="22" y="28" width="84" height="38" rx="6" fill="url(#labelGrad)"/>

    <path d="M 25,35 L 103,35" stroke="#e01b24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 25,41 L 103,41" stroke="#33d17a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 25,47 L 103,47" stroke="#3584e4" stroke-width="3" stroke-linecap="round"/>

    <rect x="28" y="58" width="72" height="38" rx="8" fill="#121216"/>
    <rect x="28" y="58" width="72" height="38" rx="8" fill="none" stroke="#24242e" stroke-width="1.5"/>

    <!-- Magnetic tape bridge between reels -->
    <rect x="42" y="70" width="44" height="14" fill="url(#tapeSheen)"/>

    <circle cx="44" cy="77" r="13" fill="#282834"/>
    <circle cx="44" cy="77" r="9" fill="#e1e1e6"/>
    <circle cx="44" cy="77" r="5" fill="#121216"/>
    <circle cx="44" cy="70.5" r="1.2" fill="#5e5c64"/>
    <circle cx="49.5" cy="80.2" r="1.2" fill="#5e5c64"/>
    <circle cx="38.5" cy="80.2" r="1.2" fill="#5e5c64"/>

    <circle cx="84" cy="77" r="13" fill="#282834"/>
    <circle cx="84" cy="77" r="9" fill="#e1e1e6"/>
    <circle cx="84" cy="77" r="5" fill="#121216"/>
    <circle cx="84" cy="70.5" r="1.2" fill="#5e5c64"/>
    <circle cx="89.5" cy="80.2" r="1.2" fill="#5e5c64"/>
    <circle cx="78.5" cy="80.2" r="1.2" fill="#5e5c64"/>

    <g filter="url(#sparkleGlow)">
      <!-- Main star: soft, rounded 4-point sparkle centered at (109, 19) -->
      <path d="M 109,11 C 109,16.5 111.5,19 117,19 C 111.5,19 109,21.5 109,27 C 109,21.5 106.5,19 101,19 C 106.5,19 109,16.5 109,11 Z"
            fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Secondary accent star: soft, rounded sparkle centered at (97, 15) -->
      <path d="M 97,10.5 C 97,13.6 98.4,15 101.5,15 C 98.4,15 97,16.4 97,19.5 C 97,16.4 95.6,15 92.5,15 C 95.6,15 97,13.6 97,10.5 Z"
            fill="#ffffff" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
